
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Converter Calc | Smart Apps Pro</title>
<style>
:root {
  --bg: #e9eef5;
  --case1: #34465e;
  --case2: #172337;
  --text: #f6faff;
  --panel: #18263a;
  --screen: #aaff73;
  --screen-text: #143c18;
  --shadow: rgba(0,0,0,.4);
}
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  padding: 22px 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: system-ui, -apple-system, sans-serif;
  color: var(--text);
  background:
    radial-gradient(ellipse at 15% 10%, #b5d9ff, transparent 40%),
    radial-gradient(ellipse at 90% 90%, #a8b5d8, transparent 45%),
    var(--bg);
  transition: background .3s;
}
body.dark {
  --bg: #080e19;
  --case1: #202b3d;
  --case2: #090f1a;
  --panel: #101b2b;
  --text: #f3f7ff;
  --shadow: rgba(0,0,0,.8);
  background:
    radial-gradient(ellipse at 50% 0%, #1b2e4c, transparent 50%),
    #080e19;
}
.app {
  width: 100%;
  max-width: 410px;
  padding: 20px;
  border-radius: 30px;
  background: linear-gradient(145deg,var(--case1),var(--case2) 70%);
  border: 1px solid rgba(255,255,255,.2);
  box-shadow:
    0 26px 45px var(--shadow),
    inset 2px 2px 3px rgba(255,255,255,.18),
    inset -3px -4px 7px rgba(0,0,0,.45);
}
.brand {
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px;
  margin-bottom:15px;
}
.brand h1 {
  font-size:18px;
  letter-spacing:1px;
  margin:0;
}
.brand small {
  display:block;
  font-size:10px;
  color:#b7cce5;
  letter-spacing:2px;
  margin-top:3px;
}
.top-actions { display:flex; gap:7px; }
.mini {
  border:1px solid #536782;
  border-radius:12px;
  background:linear-gradient(145deg,#435674,#19273c);
  color:white;
  padding:9px;
  font-size:16px;
  box-shadow:0 4px 0 #0b1422;
}
.screen-wrap {
  border-radius:18px;
  padding:7px;
  background:linear-gradient(145deg,#070d13,#3c4b50);
  box-shadow:inset 0 4px 9px #000;
  margin-bottom:15px;
}
.screen {
  min-height:106px;
  border-radius:12px;
  background:linear-gradient(160deg,#d1ffae,#aaff73 55%,#80e95b);
  color:var(--screen-text);
  padding:10px 13px;
  box-shadow:
    0 0 8px #aaff73,
    0 0 20px rgba(143,255,93,.65),
    inset 0 2px 7px rgba(255,255,255,.8);
}
.screen-label {
  font-size:10px;
  font-weight:800;
  letter-spacing:2px;
  opacity:.7;
}
#display {
  width:100%;
  border:0;
  outline:0;
  padding:8px 0 1px;
  background:transparent;
  color:var(--screen-text);
  text-align:right;
  font-size:clamp(27px,7vw,37px);
  font-family:monospace;
  font-weight:800;
  text-shadow:0 0 7px rgba(93,255,55,.45);
}
#display::placeholder { color:#50784b; }
#status {
  min-height:15px;
  text-align:right;
  font-size:11px;
  font-weight:700;
  opacity:.8;
}
.section-title {
  margin:17px 1px 9px;
  font-size:11px;
  letter-spacing:1.7px;
  color:#b7cce5;
  font-weight:800;
}
.keys {
  display:grid;
  grid-template-columns:repeat(5,minmax(0,1fr));
  gap:9px;
}
.key {
  min-width:0;
  height:51px;
  border:1px solid rgba(255,255,255,.17);
  border-radius:15px;
  background:linear-gradient(145deg,#354964,#1b2b41);
  color:#f7fbff;
  font-size:18px;
  font-weight:750;
  box-shadow:
    0 5px 0 #0c1625,
    0 7px 10px rgba(0,0,0,.25),
    inset 1px 1px 2px rgba(255,255,255,.2);
  cursor:pointer;
  user-select:none;
  -webkit-tap-highlight-color:transparent;
  transition:transform .08s,box-shadow .08s;
}
.key:active {
  transform:translateY(4px);
  box-shadow:0 1px 0 #0c1625,inset 0 2px 4px rgba(0,0,0,.3);
}
.key.sci {
  background:linear-gradient(145deg,#d94b53,#7f101d);
  box-shadow:0 5px 0 #4b0911,0 7px 10px #0004,
    inset 1px 1px 2px #ffffff55;
  color:#fff;
  font-size:14px;
}
.key.op {
  background:linear-gradient(145deg,#37bfe8,#0876b9);
  box-shadow:0 5px 0 #06456e,0 7px 10px #0003,
    inset 1px 1px 2px #ffffff70;
}
.key.util {
  background:linear-gradient(145deg,#f9bd58,#d87517);
  box-shadow:0 5px 0 #81400c,0 7px 10px #0003,
    inset 1px 1px 2px #ffffff70;
  color:#261708;
}
.key.equal {
  background:linear-gradient(145deg,#6bf2ad,#13a96c);
  box-shadow:0 5px 0 #075b38,0 7px 10px #0003,
    inset 1px 1px 2px #ffffff70;
  color:#062d1d;
}
.key.wide { grid-column:span 2; }
.converter {
  padding:13px;
  border-radius:20px;
  background:linear-gradient(145deg,#22344b,#111e30);
  border:1px solid #42536a;
  box-shadow:inset 1px 1px 2px #ffffff12,0 5px 12px #0002;
}
.converter-heading {
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:11px;
}
.converter-heading strong { font-size:14px; }
.converter-heading span { font-size:20px; }
label {
  display:block;
  margin:9px 0 5px;
  color:#b9cde5;
  font-size:11px;
  font-weight:700;
}
select,input.unit-value {
  width:100%;
  padding:12px 10px;
  border:1px solid #4b6079;
  border-radius:12px;
  background:#0d1929;
  color:white;
  font:inherit;
  font-size:14px;
  outline:none;
}
.unit-row {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
}
.swap-row {
  display:flex;
  justify-content:center;
  margin:10px 0;
}
.swap {
  width:43px;
  height:39px;
  border:0;
  border-radius:13px;
  color:white;
  font-size:20px;
  background:linear-gradient(145deg,#37bfe8,#0876b9);
  box-shadow:0 4px 0 #06456e;
}
.convert {
  width:100%;
  margin-top:12px;
  padding:13px;
  border:0;
  border-radius:14px;
  background:linear-gradient(145deg,#70f3b1,#13a96c);
  color:#052d1c;
  font-weight:900;
  font-size:15px;
  box-shadow:0 5px 0 #075b38;
}
.convert:active,.swap:active {
  transform:translateY(3px);
  box-shadow:0 1px 0 #06456e;
}
.result {
  margin-top:13px;
  padding:12px;
  min-height:67px;
  border-radius:13px;
  background:linear-gradient(145deg,#d4ffb9,#9ef06d);
  color:#143c18;
  box-shadow:0 0 12px #aaff7355,inset 0 1px 3px white;
  overflow-wrap:anywhere;
}
.result small {
  display:block;
  font-size:10px;
  font-weight:800;
  letter-spacing:1.5px;
}
#conversionResult {
  display:block;
  font-size:21px;
  font-weight:850;
  margin-top:4px;
}
#factorInfo {
  margin-top:5px;
  font-size:10px;
  opacity:.8;
}
.footer {
  text-align:center;
  color:#9cb2ce;
  font-size:10px;
  margin-top:16px;
  letter-spacing:1px;
}
@media(max-width:360px) {
  .app { padding:14px; border-radius:24px; }
  .key { height:46px; border-radius:12px; }
  .keys { gap:7px; }
  .brand h1 { font-size:16px; }
}
</style>
</head>
<body>
<main class="app">
  <header class="brand">
    <div>
      <h1>SMART CONVERTER</h1>
      <small>SMART APPS PRO</small>
    </div>
    <div class="top-actions">
      <button class="mini" id="themeBtn" onclick="toggleTheme()" aria-label="Toggle theme">🌙</button>
      <button class="mini" onclick="clearDisplay()" aria-label="Clear">AC</button>
    </div>
  </header>

  <div class="screen-wrap">
    <div class="screen">
      <div class="screen-label">SMART DISPLAY · SCIENTIFIC</div>
      <input id="display" type="text" inputmode="decimal"
        autocomplete="off" spellcheck="false" placeholder="0"
        aria-label="Calculator display">
      <div id="status">READY TO CALCULATE</div>
    </div>
  </div>

  <div class="section-title">SCIENTIFIC FUNCTIONS</div>
  <div class="keys">
    <button class="key sci" onclick="sci('sin')">sin</button>
    <button class="key sci" onclick="sci('cos')">cos</button>
    <button class="key sci" onclick="sci('tan')">tan</button>
    <button class="key sci" onclick="sci('log')">log</button>
    <button class="key sci" onclick="sci('ln')">ln</button>
    <button class="key sci" onclick="sci('sqrt')">√</button>
    <button class="key sci" onclick="sci('square')">x²</button>
    <button class="key sci" onclick="sci('reciprocal')">1/x</button>
    <button class="key sci" onclick="press('(')">(</button>
    <button class="key sci" onclick="press(')')">)</button>
  </div>

  <div class="section-title">CALCULATOR</div>
  <div class="keys">
    <button class="key util" onclick="clearDisplay()">AC</button>
    <button class="key util" onclick="del()">DEL</button>
    <button class="key util" onclick="press('%')">%</button>
    <button class="key op" onclick="press('/')">÷</button>
    <button class="key op" onclick="press('*')">×</button>

    <button class="key" onclick="press('7')">7</button>
    <button class="key" onclick="press('8')">8</button>
    <button class="key" onclick="press('9')">9</button>
    <button class="key" onclick="press('-')">−</button>
    <button class="key" onclick="press('4')">4</button>

    <button class="key" onclick="press('5')">5</button>
    <button class="key" onclick="press('6')">6</button>
    <button class="key" onclick="press('1')">1</button>
    <button class="key" onclick="press('2')">2</button>
    <button class="key" onclick="press('3')">3</button>

    <button class="key" onclick="press('0')">0</button>
    <button class="key" onclick="press('.')">.</button>
    <button class="key op" onclick="press('+')">+</button>
    <button class="key equal wide" onclick="calculate()">=</button>
  </div>

  <div class="section-title">UNIT CONVERTER</div>
  <section class="converter">
    <div class="converter-heading">
      <strong>Convert measurements</strong>
      <span>📐</span>
    </div>

    <label for="category">Measurement category</label>
    <select id="category" onchange="changeCategory()">
      <option value="length">📏 Length & distance</option>
      <option value="mass">⚖️ Mass & weight</option>
      <option value="volume">🧪 Volume</option>
      <option value="area">🌱 Area</option>
    </select>

    <label for="amount">Amount to convert</label>
    <input class="unit-value" id="amount" type="number"
      inputmode="decimal" value="1" step="any">

    <div class="unit-row">
      <div>
        <label for="fromUnit">From</label>
        <select id="fromUnit"></select>
      </div>
      <div>
        <label for="toUnit">To</label>
        <select id="toUnit"></select>
      </div>
    </div>

    <div class="swap-row">
      <button class="swap" onclick="swapUnits()" aria-label="Swap units">⇄</button>
    </div>

    <button class="convert" onclick="convert()">⚡ CONVERT NOW</button>

    <div class="result" aria-live="polite">
      <small>CONVERSION RESULT</small>
      <output id="conversionResult">1,000 mm</output>
      <div id="factorInfo">Select your units to begin.</div>
    </div>
  </section>

  <div class="footer">SMART APPS PRO · CALCULATE SMARTER</div>
</main>

<script>
const display = document.getElementById("display");
const statusText = document.getElementById("status");

function setStatus(message) {
  statusText.textContent = message;
}

function press(value) {
  if (display.value === "Error") display.value = "";
  display.value += value;
  setStatus("READY TO CALCULATE");
}

function clearDisplay() {
  display.value = "";
  setStatus("CLEARED");
}

function del() {
  display.value = display.value.slice(0, -1);
}

function formatNumber(value) {
  if (!Number.isFinite(value)) return "Error";
  if (value !== 0 && (Math.abs(value) >= 1e12 || Math.abs(value) < 1e-7)) {
    return value.toExponential(6);
  }
  return Number(value.toPrecision(12)).toLocaleString("en-US", {
    maximumFractionDigits: 10,
    useGrouping: false
  });
}

/* Safe arithmetic parser: no eval() or Function(). */
function evaluate(expression) {
  const s = expression.replace(/\s+/g, "");
  let i = 0;

  function parseExpression() {
    let value = parseTerm();
    while (s[i] === "+" || s[i] === "-") {
      const op = s[i++];
      const rhs = parseTerm();
      value = op === "+" ? value + rhs : value - rhs;
    }
    return value;
  }

  function parseTerm() {
    let value = parseUnary();
    while (["*", "/", "%"].includes(s[i])) {
      const op = s[i++];
      const rhs = parseUnary();
      if ((op === "/" || op === "%") && rhs === 0) {
        throw new Error("Cannot divide by zero");
      }
      if (op === "*") value *= rhs;
      if (op === "/") value /= rhs;
      if (op === "%") value %= rhs;
    }
    return value;
  }

  function parseUnary() {
    if (s[i] === "+") { i++; return parseUnary(); }
    if (s[i] === "-") { i++; return -parseUnary(); }
    return parsePower();
  }

  function parsePower() {
    let value = parsePrimary();
    if (s[i] === "^") {
      i++;
      value = Math.pow(value, parseUnary());
    }
    return value;
  }

  function parsePrimary() {
    if (s[i] === "(") {
      i++;
      const value = parseExpression();
      if (s[i] !== ")") throw new Error("Missing closing bracket");
      i++;
      return value;
    }

    const rest = s.slice(i);
    const match = rest.match(/^(?:\d+\.?\d*|\.\d+)(?:e[+-]?\d+)?/i);
    if (!match) throw new Error("Invalid expression");
    i += match[0].length;
    return Number(match[0]);
  }

  if (!s) throw new Error("Enter a calculation");
  const result = parseExpression();
  if (i !== s.length || !Number.isFinite(result)) {
    throw new Error("Invalid expression");
  }
  return result;
}

function calculate() {
  try {
    display.value = formatNumber(evaluate(display.value));
    setStatus("CALCULATION COMPLETE");
  } catch (error) {
    display.value = "Error";
    setStatus(error.message || "CHECK YOUR EXPRESSION");
  }
}

function sci(type) {
  try {
    const value = evaluate(display.value);
    let result;

    switch (type) {
      case "sin": result = Math.sin(value * Math.PI / 180); break;
      case "cos": result = Math.cos(value * Math.PI / 180); break;
      case "tan":
        if (Math.abs(Math.cos(value * Math.PI / 180)) < 1e-12)
          throw new Error("Tangent is undefined");
        result = Math.tan(value * Math.PI / 180);
        break;
      case "log":
        if (value <= 0) throw new Error("log requires a positive number");
        result = Math.log10(value);
        break;
      case "ln":
        if (value <= 0) throw new Error("ln requires a positive number");
        result = Math.log(value);
        break;
      case "sqrt":
        if (value < 0) throw new Error("Square root requires a non-negative number");
        result = Math.sqrt(value);
        break;
      case "square": result = value * value; break;
      case "reciprocal":
        if (value === 0) throw new Error("Cannot divide by zero");
        result = 1 / value;
        break;
      default: throw new Error("Unknown function");
    }

    if (!Number.isFinite(result)) throw new Error("Result out of range");
    display.value = formatNumber(result);
    setStatus(type.toUpperCase() + " · DEGREE MODE");
  } catch (error) {
    display.value = "Error";
    setStatus(error.message || "ENTER A VALID NUMBER");
  }
}

function toggleTheme() {
  document.body.classList.toggle("dark");
  document.getElementById("themeBtn").textContent =
    document.body.classList.contains("dark") ? "☀️" : "🌙";
}

/* Base factors: length in metres, mass in kilograms,
   volume in litres, area in square metres. */
const units = {
  length: [
    {id:"m", name:"📏 Metre (m)", factor:1},
    {id:"km", name:"🛣️ Kilometre (km)", factor:1000},
    {id:"cm", name:"📐 Centimetre (cm)", factor:0.01},
    {id:"mm", name:"📏 Millimetre (mm)", factor:0.001},
    {id:"mile", name:"🚗 Mile (mi)", factor:1609.344},
    {id:"ft", name:"👣 Feet (ft)", factor:0.3048},
    {id:"in", name:"📏 Inches (in)", factor:0.0254},
    {id:"nmi", name:"🚢 Nautical mile (nmi)", factor:1852}
  ],
  mass: [
    {id:"kg", name:"🏋️ Kilogram (kg)", factor:1},
    {id:"g", name:"🧪 Gram (g)", factor:0.001},
    {id:"mg", name:"⚗️ Milligram (mg)", factor:0.000001},
    {id:"lb", name:"⚖️ Pound (lb)", factor:0.45359237},
    {id:"quintal", name:"🌾 Quintal (100 kg)", factor:100},
    {id:"tonne", name:"🚚 Metric tonne (t)", factor:1000}
  ],
  volume: [
    {id:"l", name:"🧪 Litre (L)", factor:1},
    {id:"ml", name:"💧 Millilitre (mL)", factor:0.001},
    {id:"m3", name:"🛢️ Cubic metre (m³)", factor:1000},
    {id:"cm3", name:"🧫 Cubic centimetre (cm³)", factor:0.001},
    {id:"usgal", name:"🪣 US gallon (gal)", factor:3.785411784},
    {id:"ukgal", name:"🪣 Imperial gallon (UK gal)", factor:4.54609}
  ],
  area: [
    {id:"m2", name:"🌱 Square metre (m²)", factor:1},
    {id:"km2", name:"🗺️ Square kilometre (km²)", factor:1000000},
    {id:"cm2", name:"📐 Square centimetre (cm²)", factor:0.0001},
    {id:"ha", name:"🌳 Hectare (ha)", factor:10000},
    {id:"acre", name:"🌾 Acre (ac)", factor:4046.8564224},
    {id:"ft2", name:"🏠 Square foot (ft²)", factor:0.09290304}
  ]
};

const category = document.getElementById("category");
const fromUnit = document.getElementById("fromUnit");
const toUnit = document.getElementById("toUnit");
const amount = document.getElementById("amount");
const conversionResult = document.getElementById("conversionResult");
const factorInfo = document.getElementById("factorInfo");

function fillSelect(select, list) {
  select.innerHTML = "";
  list.forEach(unit => {
    const option = document.createElement("option");
    option.value = unit.id;
    option.textContent = unit.name;
    select.appendChild(option);
  });
}

function changeCategory() {
  const list = units[category.value];
  fillSelect(fromUnit, list);
  fillSelect(toUnit, list);
  fromUnit.selectedIndex = 0;
  toUnit.selectedIndex = Math.min(1, list.length - 1);
  convert();
}

function swapUnits() {
  const oldFrom = fromUnit.value;
  fromUnit.value = toUnit.value;
  toUnit.value = oldFrom;
  convert();
}

function convert() {
  const value = Number(amount.value);
  if (amount.value.trim() === "" || !Number.isFinite(value)) {
    conversionResult.textContent = "Enter a valid amount";
    factorInfo.textContent = "";
    return;
  }

  const list = units[category.value];
  const from = list.find(u => u.id === fromUnit.value);
  const to = list.find(u => u.id === toUnit.value);

  if (!from || !to) return;

  const result = value * from.factor / to.factor;
  if (!Number.isFinite(result)) {
    conversionResult.textContent = "Result out of range";
    factorInfo.textContent = "";
    return;
  }

  conversionResult.textContent =
    Number(result.toPrecision(10)).toLocaleString("en-US", {
      maximumFractionDigits: 10
    }) + " " + to.id;

  factorInfo.textContent =
    "1 " + from.id + " = " +
    Number((from.factor / to.factor).toPrecision(10)).toLocaleString("en-US") +
    " " + to.id;
}

amount.addEventListener("input", convert);
fromUnit.addEventListener("change", convert);
toUnit.addEventListener("change", convert);

/* Physical keyboard support */
document.addEventListener("keydown", event => {
  if (event.target === amount ||
      event.target === fromUnit ||
      event.target === toUnit ||
      event.target === category) return;

  if (/^[0-9.+\-*/()%]$/.test(event.key)) {
    event.preventDefault();
    press(event.key);
  } else if (event.key === "Enter" || event.key === "=") {
    event.preventDefault();
    calculate();
  } else if (event.key === "Backspace") {
    event.preventDefault();
    del();
  } else if (event.key === "Escape") {
    clearDisplay();
  }
});

changeCategory();
</script>
</body>
</html>
